name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Screenshots of every scene (on failure)
        if: failure()
        run: SHOTS=shots npm test || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
